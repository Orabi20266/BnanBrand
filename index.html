<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BnanBrand | منتجات نسائية فاخرة — إكسسوارات وهدايا وعطور</title>
<meta name="description" content="BnanBrand — متجرك الأنيق للإكسسوارات والمجوهرات وصناديق الهدايا والعطور ومنتجات العناية، بتصميم أنثوي راقٍ وتوصيل سريع.">
<meta name="theme-color" content="#E75480">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23E75480'/><path d='M22 38 50 25l28 13v26L50 77 22 64z' fill='none' stroke='white' stroke-width='6' stroke-linejoin='round'/></svg>">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main>
<!-- ============ الصفحة الرئيسية = صفحة المنتجات ============ -->
<section class="page-hero">
  <div class="container">
    <h1 style="margin-bottom:.4rem">منتجاتنا</h1>
    <p style="max-width:680px;margin:0 auto">تشكيلة <b>BnanBrand</b> من الإكسسوارات والمجوهرات وصناديق الهدايا والعطور ومنتجات العناية — تصفية فورية حسب التصنيف، وترتيب ذكي، وبحث سريع.</p>
  </div>
</section>

<section class="section">
  <div class="container">

    <!-- أدوات التصفية -->
    <div class="cats" id="filterChips"></div>

    <div class="toolbar">
      <label class="search">
        <span class="sr-only">ابحث في المنتجات</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="searchInput" placeholder="ابحث باسم المنتج أو رقمه…">
      </label>
      <div class="select-wrap">
        <label class="sr-only" for="sortSelect">ترتيب حسب</label>
        <select id="sortSelect">
          <option value="featured">الأكثر رواجاً</option>
          <option value="price-asc">السعر: من الأقل</option>
          <option value="price-desc">السعر: من الأعلى</option>
          <option value="rating">الأعلى تقييماً</option>
          <option value="name">الاسم أبجدياً</option>
        </select>
      </div>
      <span class="result-count" id="resultCount"></span>
    </div>

    <!-- شبكة المنتجات -->
    <div class="products-grid" id="productsGrid"></div>

    <div class="empty-state" id="emptyState" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M3 8.5 12 4l9 4.5v7L12 20l-9-4.5z"/><path d="M3 8.5 12 13l9-4.5M12 13v7"/><path d="M8.5 2.5 8 6M15.5 2.5 15 6"/></svg>
      <h3>لا توجد نتائج مطابقة</h3>
      <p>جرّبي تعديل كلمة البحث أو اختيار تصنيف آخر.</p>
      <a href="index.html" class="btn btn--primary">عرض كل المنتجات</a>
    </div>
  </div>
</section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/config.js?v=5"></script>
<script src="assets/js/data.js?v=6"></script>
<script src="assets/js/icons.js?v=5"></script>
<script src="assets/js/api.js?v=5"></script>
<script src="assets/js/main.js?v=9"></script>
</body>
</html>
